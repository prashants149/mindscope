name: MindScope CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    name: Backend Test Suite & Safety Audits
    runs-on: ubuntu-latest
    env:
      KMP_DUPLICATE_LIB_OK: "TRUE"
      NUMBA_CACHE_DIR: "/tmp/numba_cache"
      KERAS_HOME: "/tmp/keras_home"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run Core Test Suite with Coverage
        run: |
          pytest tests/test_validation.py tests/test_visualization.py tests/test_models.py tests/test_fairness.py tests/test_explainability.py tests/test_causal.py tests/test_generator.py tests/test_assistant.py -v --cov=src --cov-report=term-missing

      - name: Run 32-Prompt Assistant Red-Teaming Battery
        run: |
          python scripts/test_assistant_30_prompts.py

      - name: Run Algorithmic Fairness Subgroup Audit
        run: |
          python src/fairness/audit.py

  frontend-build:
    name: Frontend TypeScript & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend Dependencies
        working-directory: web
        run: npm install --legacy-peer-deps

      - name: TypeScript Type Check
        working-directory: web
        run: npx tsc --noEmit

      - name: Build Next.js Application
        working-directory: web
        run: npm run build
